name: Mobile Android pilot preview APK

# RafSkoru Aşama 10 — yalnız `test/android-pilot-preview` dalının PR'ı için, kurulabilir bir
# pilot önizleme APK'sı üretir ve GitHub Actions artifact'ı olarak yükler. Üretime yayın yapmaz;
# EAS, Play Store veya herhangi bir mağaza kullanmaz; üretim imza anahtarı kullanmaz — Android'in
# standart varsayılan davranışıyla, `release` build type'ı Expo'nun otomatik ürettiği YEREL debug
# keystore ile imzalanır (android/app/build.gradle'da signingConfigs.release tanımlı DEĞİLDİR;
# `release` buildType `signingConfigs.debug`'ı kullanır — bu, CI'da üretilen, gizli olmayan,
# herkese açık standart Android debug anahtarıdır). Mevcut `mobile-android-build.yml` derleme
# kapısını DEĞİŞTİRMEZ; bu tamamen ayrı, ek bir iş akışıdır.
#
# `assembleDebug` yerine `assembleRelease` kullanılır: debug build type Metro'ya bağımlı JS
# bundling'i atlar (debuggableVariants varsayılanı yalnız 'debug'), release build type ise JS
# bundle'ı ve varlıkları APK içine gömer — telefon Metro sunucusuna ihtiyaç duymadan çalışır.

"on":
  pull_request:
    branches:
      - integration/rafskoru-ready-for-code
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-android-pilot-preview.yml"

permissions:
  contents: read

jobs:
  android-pilot-preview:
    name: Pilot preview APK (assembleRelease, debug-signed, Metro'suz)
    if: github.head_ref == 'test/android-pilot-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Yalnız bu job ortamında açık — hiçbir .env/app.json/üretim yapılandırma dosyasına yazılmaz.
      # Mevcut üç bayrağın varsayılan kapalı durumu repo genelinde DEĞİŞMEZ.
      EXPO_PUBLIC_LOCAL_PRODUCT_RECOVERY: "1"
      EXPO_PUBLIC_LOCAL_OCR: "1"
      EXPO_PUBLIC_CONSUMER_UX_V2: "1"
      EXPO_PUBLIC_PILOT_PREVIEW: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: npm ci
        working-directory: apps/mobile
        run: npm ci

      - name: Expo prebuild (Android only)
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build pilot preview APK (assembleRelease)
        working-directory: apps/mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Locate APK, rename with short SHA
        id: locate
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK bulunamadı: $APK_PATH"
            find android/app/build/outputs -type f -name "*.apk" || true
            exit 1
          fi
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          RENAMED="rafskoru-pilot-preview-${SHORT_SHA}.apk"
          cp "$APK_PATH" "$RENAMED"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "apk_file=${RENAMED}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=rafskoru-pilot-preview-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Verify APK (existence, signature, package/version, JS bundle, SHA-256, size)
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          APK_FILE="${{ steps.locate.outputs.apk_file }}"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          echo "== 1) APK dosyası gerçekten oluştu mu =="
          test -f "$APK_FILE"
          ls -la "$APK_FILE"

          BUILD_TOOLS_DIR="$(find "$SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n1)"
          echo "Kullanılan build-tools: $BUILD_TOOLS_DIR"

          echo "== 2) İmza doğrulama (apksigner) — üretim anahtarı DEĞİL, yerel debug keystore =="
          "$BUILD_TOOLS_DIR/apksigner" verify --print-certs "$APK_FILE" | tee apksigner-output.txt

          echo "== 3) Paket adı ve sürüm (aapt dump badging) =="
          "$BUILD_TOOLS_DIR/aapt" dump badging "$APK_FILE" | grep -E "^package:|versionCode|versionName" | tee package-info.txt

          echo "== 4) JS bundle APK içinde mi (assets/index.android.bundle) =="
          unzip -l "$APK_FILE" | grep -E "assets/index\.android\.bundle" | tee bundle-check.txt
          if [ ! -s bundle-check.txt ]; then
            echo "::error::JS bundle APK içinde bulunamadı"
            exit 1
          fi

          echo "== 5) SHA-256 =="
          sha256sum "$APK_FILE" | tee sha256.txt

          echo "== 6) Dosya boyutu =="
          stat -c '%s bytes (%s)' "$APK_FILE" "$APK_FILE" | tee size.txt || wc -c < "$APK_FILE"

          {
            echo "## Pilot önizleme APK doğrulaması"
            echo ""
            echo "- Dosya: \`$APK_FILE\`"
            echo "- Boyut: $(stat -c '%s' "$APK_FILE") bayt"
            echo "- SHA-256: \`$(cut -d' ' -f1 sha256.txt)\`"
            echo "- Paket/sürüm:"
            echo '```'
            cat package-info.txt
            echo '```'
            echo "- İmza doğrulama:"
            echo '```'
            cat apksigner-output.txt
            echo '```'
            echo "- JS bundle: bulundu (\`assets/index.android.bundle\`)"
            echo "- Açık pilot bayrakları: EXPO_PUBLIC_LOCAL_PRODUCT_RECOVERY, EXPO_PUBLIC_LOCAL_OCR, EXPO_PUBLIC_CONSUMER_UX_V2, EXPO_PUBLIC_PILOT_PREVIEW (yalnız bu job ortamında)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload pilot preview APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.locate.outputs.artifact_name }}
          path: apps/mobile/${{ steps.locate.outputs.apk_file }}
          retention-days: 7
